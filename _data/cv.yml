        url: https://www.researchgate.net/publication/400096314_Supervised_Machine_Learning_for_Credit_Default_Prediction
        summary: Preprint. An end-to-end credit risk model on the German Credit dataset (1,000 observations, 20 variables), using R. Logistic regression with stepwise selection reduced AIC from 730 to 704 (-3.6%) and residual deviance by approximately 26%; model performance reached AUC = 0.78.

