      - title: "Multi-Horizon VIX Forecasting: Econometric, ML and Deep Learning Models with Prediction Market Features"
        authors:
          - Federico Mariani
        summary: Developing paper based on a thesis benchmarking Random Walk, ARIMA, HAR-Type, Random Forest, XGBoost, LSTM, and TFT models to forecast the CBOE VIX across 1-, 5-, and 22-day horizons. Polymarket prediction-market features were engineered and models optimized using Grid Search CV and Bayesian Optimization. Directional accuracy reached up to 67.86%; TFT was the most competitive deep learning architecture for point-forecast accuracy at longer horizons.

